        {
        {% for item, device in custom_alexa_devices.items() %}
            {% if device.id %}
                {%- if not loop.first %},{% endif %}"{{device.id}}": "{{device.location}}"
            {% endif %}
        {% endfor %}
        }
    alexa_location_device_map: |
        {
        {% for item, device in custom_alexa_devices.items() %}
            {%- if not loop.first %},{% endif %}"{{device.location}}": "{{item}}"
        {% endfor %}
        }
